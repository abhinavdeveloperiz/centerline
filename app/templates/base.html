{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Centerline Technical Services
        {% endblock %}
    </title>

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "var(--primary)",
                        secondary: "var(--secondary)",
                        accent: "var(--accent)",
                    },
                },
            },
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #00337a;
            --secondary: #39c0ba;
            --accent: #8cc88c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #ffffff;
            color: #111827;
            overflow-x: hidden;
        }

        .text-primary {
            color: var(--primary);
        }

        .bg-primary {
            background: var(--primary);
        }

        .text-secondary {
            color: var(--secondary);
        }

        .bg-secondary {
            background: var(--secondary);
        }
    </style>



</head>

<body>

    <!-- Heavy Preloader Overlay -->
    <div id="website-preloader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white/50 backdrop-blur-md transition-opacity duration-500">
        <div class="relative flex items-center justify-center w-28 h-28">
            <!-- Heavy Outer Spinning Ring -->
            <div class="absolute inset-0 border-[6px] border-slate-200/40 border-t-primary border-r-secondary rounded-full animate-spin"></div>
            <!-- Counter-Rotating Inner Ring -->
            <div class="absolute inset-2 border-[5px] border-slate-200/40 border-b-primary border-l-secondary rounded-full animate-[spin_1.2s_linear_infinite_reverse]"></div>
            <!-- Pulsing Center Core -->
            <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center text-secondary shadow-xl animate-pulse">
                <i class="fa-solid fa-heart-pulse text-xl"></i>
            </div>
        </div>
        <span class="mt-5 font-extrabold text-primary tracking-[0.3em] uppercase text-xs animate-pulse">Centerline</span>
    </div>

    {% include 'partials/navbar.html' %}

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    {% include 'partials/footer.html' %}

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });

        // Preloader Fade Out
        window.addEventListener("load", () => {
            const preloader = document.getElementById("website-preloader");
            if (preloader) {
                preloader.style.opacity = "0";
                setTimeout(() => {
                    preloader.style.display = "none";
                }, 500);
            }
        });
    </script>

</body>

</html>
